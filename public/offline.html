<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d18" />
    <title>Offline — Wealthpilot</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root {
        --background: oklch(0.118 0.027 286);
        --foreground: oklch(0.976 0.007 282);
        --card: oklch(0.177 0.034 286 / 0.9);
        --muted-foreground: oklch(0.73 0.021 282);
        --primary: oklch(0.665 0.205 296);
        --accent: oklch(0.835 0.15 166);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1.25rem
          calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
        background: var(--background);
        color: var(--foreground);
        font-family:
          Manrope,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        text-align: center;
        border: 1px solid rgb(255 255 255 / 0.08);
        border-radius: 1.5rem;
        background: var(--card);
        padding: 2rem 1.5rem;
        box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.9);
      }
      .badge {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        box-shadow: 0 18px 40px -22px var(--primary);
      }
      .badge svg {
        width: 1.75rem;
        height: 1.75rem;
      }
      .eyebrow {
        margin-top: 1.5rem;
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.625rem 0 0;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted-foreground);
      }
      button {
        margin-top: 1.75rem;
        width: 100%;
        min-height: 3rem;
        border: 0;
        border-radius: 1rem;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:active {
        transform: scale(0.98);
      }
      .status {
        margin-top: 1rem;
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M2 2 22 22" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <path d="M5 12.9a10 10 0 0 1 4-2.6" />
          <path d="M15 10.3a10 10 0 0 1 4 2.6" />
          <path d="M2 8.8a15 15 0 0 1 4.2-2.9" />
          <path d="M17.8 5.9A15 15 0 0 1 22 8.8" />
          <path d="M12 20h.01" />
        </svg>
      </div>

      <div class="eyebrow">No connection</div>
      <h1>You're offline</h1>
      <p>
        Wealthpilot can't reach your data right now. Screens you opened recently are still readable
        — anything you change needs a connection to save.
      </p>

      <button type="button" onclick="location.reload()">Try again</button>
      <div class="status" id="status">Waiting for a network connection…</div>
    </main>

    <script>
      // Reload automatically the moment connectivity returns.
      window.addEventListener("online", function () {
        document.getElementById("status").textContent = "Back online — reloading…";
        location.reload();
      });
    </script>
  </body>
</html>
